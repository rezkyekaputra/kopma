---
layout: default
---

<article class="post-single">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <div class="post-meta">
      Dipublikasikan pada: <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d %B %Y" }}</time>
      {% if page.author %} &bull; Oleh: {{ page.author }}{% endif %}
    </div>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <div class="post-footer">
    <a href="{{ '/' | relative_url }}" class="btn-secondary">&larr; Kembali ke Beranda</a>
  </div>
</article>
